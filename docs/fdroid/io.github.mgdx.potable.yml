# SHA-256 of the release certificate (docs/release.md). Uncomment together
# with `binary:` above, once a signed APK is published on the releases page.
# AllowedAPKSigningKeys: 1a60e23938a43fccda3c3046b09a940d114da8a986ddeeda501ad0d303e3c82d

AutoUpdateMode: Version
# No UpdateCheckData: checkupdates reads the literal versionCode/versionName
# of app/build.gradle.kts (subdir) at the tagged commit.
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.3.0
CurrentVersionCode: 5
