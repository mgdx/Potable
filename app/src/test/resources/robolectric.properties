# Android version Robolectric simulates for the :app JVM tests that need a
# Context (intents, WorkManager requests). Robolectric only simulates the
# versions it publishes an image for; compileSdk (37) is ahead of 4.16.
sdk=34
# A plain Application: PotableApplication would start the alert scheduler,
# hence WorkManager, before the test initialises its own.
application=android.app.Application
